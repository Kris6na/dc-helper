name: Test news API
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call the site API
        run: |
          curl -s -o out.json -w "HTTP status: %{http_code}\n" --max-time 30 \
            -X POST "https://www-api.pandadagames.com/new/lists" \
            -A "Mozilla/5.0 (compatible; EachClanNewsBot/1.0)" \
            -H "Content-Type: application/json" \
            -H "lang: t_chinese" \
            -H "Origin: https://www.pandadagames.com" \
            -H "Referer: https://www.pandadagames.com/" \
            -d '{"cate_id":0,"page":1,"rows":10}'
          echo "--- first 600 characters ---"
          head -c 600 out.json
